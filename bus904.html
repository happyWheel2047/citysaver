<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>終極巴士 Dashboard (TDAS 逐站驗證版)</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="巴士 ETA">
    <meta name="theme-color" content="#2c3e50">
    
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232c3e50%22/><text x=%2250%22 y=%2250%22 font-size=%2260%22 text-anchor=%22middle%22 dominant-baseline=%22central%22>🚌</text></svg>">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%22 y=%2250%22 font-size=%2260%22 text-anchor=%22middle%22 dominant-baseline=%22central%22>🚌</text></svg>">

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

    <style>
        :root { --bg: #f4f4f9; --card-bg: #ffffff; --text: #333333; --kmb-color: #e60012; --ctb-color: #fcd116; --ctb-text: #00558f; --fare-color: #d35400; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; justify-content: center; overscroll-behavior-y: none; }
        #app { width: 100%; max-width: 480px; background: var(--bg); min-height: 100vh; box-shadow: 0 0 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        header { background-color: #2c3e50; color: white; padding: calc(15px + env(safe-area-inset-top)) 20px 15px; text-align: center; font-size: 1.1rem; font-weight: bold; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        .header-title { flex: 1; text-align: left; }
        .header-refresh { background: #3498db; color: white; border: none; padding: 6px 12px; border-radius: 15px; font-size: 0.85rem; font-weight: bold; cursor: pointer; margin: 0; width: auto; }
        
        .container { padding: 15px; flex: 1; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        .section-boss { margin-bottom: 25px; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.03); }
        .section-title { font-size: 1.1rem; margin-bottom: 12px; font-weight: bold; border-bottom: 2px solid #eee; padding-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
        .section-icon { margin-right: 8px; }
        .update-info { text-align: right; font-size: 0.75rem; color: #7f8c8d; margin-bottom: 10px; min-height: 14px; }

        .input-group { display: flex; gap: 10px; margin-bottom: 10px; }
        input[type="text"], input[type="number"], select, button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; box-sizing: border-box; }
        button { background-color: #34495e; color: white; border: none; font-weight: bold; cursor: pointer; transition: opacity 0.2s; margin-bottom: 10px; }
        button:hover { opacity: 0.9; }
        .btn-add-single { background-color: #16a085; } .btn-add-p2p { background-color: #2980b9; }
        .btn-action-group { display: flex; gap: 10px; margin-top: 10px; } .btn-action-group button { margin-bottom: 0; flex: 1; font-size: 0.85rem; padding: 12px 5px;}
        
        .auto-discover-box { background: #e8f8f5; border: 1px dashed #1abc9c; padding: 8px 10px; border-radius: 6px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; color: #16a085; font-weight: bold; }
        .auto-discover-box input[type="checkbox"] { width: auto; margin: 0; transform: scale(1.2); }

        .bus-card { background: var(--card-bg); padding: 12px; border-radius: 8px; border: 1px solid #f0f0f0; margin-bottom: 12px; }
        .bus-card.sortable-ghost { opacity: 0.4; }
        
        .stop-header { display: flex; align-items: flex-start; margin-bottom: 10px; background: #f8f9fa; padding: 8px; border-radius: 6px; }
        .header-single { border-left: 4px solid #16a085; } .header-p2p { border-left: 4px solid #3498db; }
        .drag-handle { cursor: grab; font-size: 1.2rem; color: #95a5a6; margin-right: 10px; touch-action: none; }
        .stop-title { font-size: 0.95rem; font-weight: bold; line-height: 1.4; flex: 1; }
        .stop-origin { color: #2980b9; } .stop-dest { color: #c0392b; margin-top: 2px; }
        
        .tracked-routes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed #eee; }
        .tracked-tag { display: inline-flex; align-items: center; font-size: 0.8rem; padding: 3px 8px; border-radius: 12px; font-weight: bold; }
        .delete-x { margin-left: 6px; cursor: pointer; background: rgba(255,255,255,0.3); border-radius: 50%; width: 14px; height: 14px; display: inline-flex; justify-content: center; align-items: center; font-size: 0.7rem; }
        
        .badge { font-size: 0.8rem; padding: 2px 5px; border-radius: 4px; font-weight: bold; min-width: 28px; text-align: center; display: inline-block; flex-shrink: 0; }
        .badge-kmb { background-color: var(--kmb-color); color: white; } .badge-ctb { background-color: var(--ctb-color); color: var(--ctb-text); }
        .fare-tag { font-weight: bold; color: var(--fare-color); background: #fdf2e9; padding: 1px 3px; border-radius: 4px; font-size: 0.7rem; border: 1px solid #fad7a1; }

        .eta-list { list-style: none; padding: 0; margin: 0; }
        .eta-item { padding: 8px 0; border-bottom: 1px solid #f9f9f9; display: flex; justify-content: space-between; align-items: center; gap: 4px; }
        .eta-item:last-child { border-bottom: none; padding-bottom: 0; }
        .eta-route-info { display: flex; align-items: center; gap: 4px; flex-shrink: 0; max-width: 50%; }
        .eta-time-info { display: flex; align-items: center; justify-content: flex-end; flex-grow: 1; gap: 4px; }

        .origin-time { font-weight: bold; color: #27ae60; font-size: 0.9rem; }
        .dest-time { font-weight: bold; font-size: 0.85rem; }
        .arrow-icon { color: #bdc3c7; font-size: 0.7rem; }
        .fastest-tag { background: #ffcccc; color: #c0392b; font-size: 0.65rem; padding: 1px 3px; border-radius: 3px; font-weight: bold; flex-shrink: 0; }
        .rmk-text { color: #7f8c8d; font-size: 0.7rem; max-width: 40px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dest-text { font-size: 0.75rem; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50px; }
        
        #loadingMsg { display: none; color: #666; font-size: 0.9rem; text-align: center; margin-bottom: 10px; }
        .manual-fare-container { display: flex; align-items: center; gap: 10px; margin: 10px 0; background: #fef5f0; padding: 8px 12px; border-radius: 6px; border: 1px dashed var(--fare-color); }
        .manual-fare-label { font-size: 0.85rem; font-weight: bold; color: var(--fare-color); white-space: nowrap; }
        .empty-state { text-align: center; color: #aaa; font-size: 0.9rem; padding: 20px 0; }

        /* 🧠 終端機與 AI 進度條 CSS */
        #dataCollectionLog { background:#1e272e; font-family:'Courier New', Courier, monospace; padding:12px; border-radius:8px; height:180px; overflow-y:auto; font-size:0.75rem; line-height: 1.5; border: 1px solid #485460; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .ai-route-item { background: #fafafa; border: 1px solid #eaeaea; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
        .ai-route-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; margin-bottom: 8px; }
        .ai-route-name { font-weight: bold; display: flex; align-items: center; gap: 6px; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; margin-right: 10px;}
        .ai-level-badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; background: #f4ebfa; color: #8e44ad; font-weight: bold; flex-shrink: 0;}
        .ai-progress-bg { background: #dfe6e9; border-radius: 10px; height: 8px; overflow: hidden; width: 100%; position: relative; margin-bottom: 5px; }
        .ai-progress-bar { background: linear-gradient(90deg, #9b59b6, #3498db); height: 100%; width: 0%; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .ai-progress-bar.master { background: linear-gradient(90deg, #f1c40f, #e67e22); }
        .ai-meta { display: flex; justify-content: space-between; font-size: 0.7rem; color: #7f8c8d; }
    </style>
</head>
<body>

<div id="app">
    <header>
        <div class="header-title">🚌 終極巴士 Dashboard <span style="font-size:0.7rem; background:#8e44ad; padding:2px 6px; border-radius:10px;">逐站驗證版</span></div>
        <button class="header-refresh" onclick="renderAll()">🔄 更新</button>
    </header>
    
    <div class="container">
        
        <!-- 📡 TDAS 實時數據採集進度終端機 -->
        <div class="section-boss" id="boss-data-collection">
            <div class="section-title"><span><span class="section-icon">📡</span> 實時數據採集與 TDAS 微段驗證</span></div>
            <div id="dataCollectionLog">
                <div style="color: #0fb9b1;">> 啟動逐站 (Stop-by-Stop) 實時追蹤引擎...</div>
                <div style="color: #0fb9b1;">> 準備與政府 TDAS 系統進行路況交叉核對...</div>
            </div>
        </div>

        <div class="section-boss" id="boss-single">
            <div class="section-title"><span><span class="section-icon">📍</span> 單站到站追蹤</span></div>
            <div id="singleUpdateTime" class="update-info"></div>
            <div id="singleFavoritesList"></div>
        </div>

        <div class="section-boss" id="boss-p2p">
            <div class="section-title"><span><span class="section-icon">🗺️</span> 點對點追蹤</span></div>
            <div id="p2pUpdateTime" class="update-info" style="color: rgb(39, 174, 96);"></div>
            <div id="p2pFavoritesList"></div>
        </div>

        <div class="section-boss">
            <div class="section-title"><span><span class="section-icon">🔍</span> 搜尋與新增路線</span></div>
            <div class="input-group">
                <select id="companySelect" style="flex: 1;"><option value="KMB">九巴 KMB</option><option value="CTB">城巴 CTB</option></select>
                <select id="dirSelect" style="flex: 1;"><option value="outbound">去程 (Outbound)</option><option value="inbound">回程 (Inbound)</option></select>
            </div>
            <input type="text" id="routeInput" placeholder="輸入路線 (如: 104, 112, 1A)" style="text-transform: uppercase;">
            <button onclick="searchRoute()" style="background-color: #2c3e50;">🔍 搜尋車站與車費</button>
            <div id="loadingMsg" style="display: none;">載入中...</div>
            
            <div id="stopSelectionArea" style="display: none; margin-top: 10px;">
                <select id="originSelect" onchange="updateDestDropdown()" style="margin-bottom: 10px;"><option value="">🟢 請選擇上車地點 (必填)...</option></select>
                <select id="destSelect" style="margin-bottom: 10px;"><option value="">🏁 請選擇下車地點 (如需點對點)...</option></select>
                <div class="manual-fare-container">
                    <span class="manual-fare-label">💰 車費($)：</span>
                    <input type="number" id="manualFareInput" step="0.1" placeholder="手動修正">
                </div>
                <div class="auto-discover-box">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="autoDiscoverCheck" checked="">
                        <label for="autoDiscoverCheck">✨ 自動尋找相同路徑巴士</label>
                    </div>
                </div>
                <div class="btn-action-group">
                    <button class="btn-add-single" onclick="addSingleFavorite()">📍 加入單站</button>
                    <button class="btn-add-p2p" onclick="addP2PFavorite()">🗺️ 加入點對點</button>
                </div>
            </div>
        </div>

        <div class="section-boss" id="boss-ai-status">
            <div class="section-title"><span><span class="section-icon">🧠</span> AI 矩陣學習進度</span></div>
            <div id="aiLearningList" class="empty-state">⏳ 等待數據收集引擎送入數據...</div>
        </div>
        
        <div class="section-boss" style="background: transparent; box-shadow: none; padding: 0;">
            <div class="input-group" style="margin-bottom: 0;">
                <button onclick="exportData()" style="background-color: #e67e22;">📤 匯出備份</button>
                <button onclick="document.getElementById('importFile').click()" style="background-color: #8e44ad;">📥 匯入備份</button>
                <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
            </div>
            <div style="text-align: center; margin-top: 10px;">
                <button onclick="clearLearningCache()" style="background-color: #7f8c8d; font-size: 0.8rem; padding: 8px;">清除所有緩存及 AI 學習數據</button>
            </div>
        </div>
    </div>
</div>

<script>
    const KMB_API = 'https://data.etabus.gov.hk/v1/transport/kmb';
    const CTB_API = 'https://rt.data.gov.hk/v2/transport/citybus';
    const TDAS_API = 'https://tdas-api.hkemobility.gov.hk/tdas/api/route';
    
    let allKmbStopsCache = {};
    let singleFavorites = JSON.parse(localStorage.getItem('hkbus_favorites')) || [];
    let p2pFavorites = JSON.parse(localStorage.getItem('hkbus_favorites_v2')) || [];
    let travelTimeDB = JSON.parse(localStorage.getItem('hkbus_travel_time_db')) || {};
    let tdasCache = JSON.parse(localStorage.getItem('hkbus_tdas_cache')) || {};
    
    // 🧠 AI 神經網絡權重庫
    let aiModelDB = JSON.parse(localStorage.getItem('hkbus_ai_model')) || {};
    const LEARNING_RATE = 0.05; 
    let trainedBuses = new Set(); 
    
    let isUpdating = false; let currentStopsData = []; let currentSearch = {};

    // ==========================================
    // 🖥️ 終端機 UI 紀錄器
    // ==========================================
    function logDataCollection(msg, type = "info") {
        const logDiv = document.getElementById('dataCollectionLog');
        const time = new Date().toLocaleTimeString('zh-HK', {hour12:false});
        let color = "#00d2d3"; // cyan
        if (type === "success") color = "#10ac84"; // green
        if (type === "warning") color = "#ff9f43"; // orange
        if (type === "error") color = "#ee5253"; // red
        
        const entry = document.createElement('div');
        entry.style.color = color;
        entry.style.marginBottom = "4px";
        entry.innerHTML = `<span style="color:#747d8c">[${time}]</span> ${msg}`;
        
        logDiv.appendChild(entry);
        // 保持終端機不會過長
        while (logDiv.childElementCount > 60) logDiv.removeChild(logDiv.firstChild);
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    // ==========================================
    // 🧠 AI 核心：連續學習與特徵提取
    // ==========================================
    function getFeatures() {
        const d = new Date(); const hour = d.getHours();
        return { base: 1, weekend: (d.getDay() === 0 || d.getDay() === 6) ? 1 : 0, morningRush: (hour >= 7 && hour <= 9) ? 1 : 0, eveningRush: (hour >= 17 && hour <= 19) ? 1 : 0 };
    }

    function trainModel(company, route, dir, oId, dId, oName, dName, actualMins) {
        const routeKey = `${company}_${route}_${dir}_${oId}_${dId}`;
        const features = getFeatures();
        
        if (!aiModelDB[routeKey]) { aiModelDB[routeKey] = { wBase: actualMins, wWeekend: 0, wMorning: 0, wEvening: 0, company, route, oName, dName, trainCount: 0, lastError: 0, lastUpdate: 0 }; }
        
        let weights = aiModelDB[routeKey];
        let predictedMins = weights.wBase * features.base + weights.wWeekend * features.weekend + weights.wMorning * features.morningRush + weights.wEvening * features.eveningRush;
        let error = actualMins - predictedMins;
        
        if (Math.abs(error) > 30) return; // 極端異常值保護

        weights.wBase = Math.max(1, weights.wBase + LEARNING_RATE * error * features.base);
        weights.wWeekend += LEARNING_RATE * error * features.weekend;
        weights.wMorning += LEARNING_RATE * error * features.morningRush;
        weights.wEvening += LEARNING_RATE * error * features.eveningRush;
        
        weights.trainCount += 1; weights.lastError = Math.abs(error); weights.lastUpdate = Date.now();
        weights.oName = oName; weights.dName = dName;
        
        aiModelDB[routeKey] = weights;
        localStorage.setItem('hkbus_ai_model', JSON.stringify(aiModelDB));
        renderAILearningProgress(); 
    }

    // 微段預測
    function predictTravelTime(routeKey) {
        if (!aiModelDB[routeKey]) return null;
        const features = getFeatures(); const weights = aiModelDB[routeKey];
        return Math.max(1, Math.round(weights.wBase * features.base + weights.wWeekend * features.weekend + weights.wMorning * features.morningRush + weights.wEvening * features.eveningRush));
    }

    // 矩陣聚合預測 (將多個微段加起來)
    function predictTravelTimeMatrix(company, route, dir, routeStops) {
        if (!routeStops || routeStops.length < 2) return null;
        let totalMins = 0;
        for (let i = 0; i < routeStops.length - 1; i++) {
            let key = `${company}_${route}_${dir}_${routeStops[i].stopId}_${routeStops[i+1].stopId}`;
            if (!aiModelDB[key]) return null; // 矩陣未完成
            let features = getFeatures(); let weights = aiModelDB[key];
            let mins = weights.wBase * features.base + weights.wWeekend * features.weekend + weights.wMorning * features.morningRush + weights.wEvening * features.eveningRush;
            totalMins += Math.max(1, mins);
        }
        return Math.round(totalMins);
    }

    // ==========================================
    // 📡 逐站驗證與 TDAS 交叉核對引擎 (Micro-Segment Engine)
    // ==========================================
    async function startAutoLearningEngine() {
        async function scanAndLearn() {
            if (p2pFavorites.length === 0) return;
            const now = new Date();
            
            let routeQueries = new Map();
            p2pFavorites.forEach(fav => {
                let q = `${fav.company}|${fav.route}`;
                if(!routeQueries.has(q)) routeQueries.set(q, []);
                routeQueries.get(q).push(fav);
            });
            
            for (let [query, favs] of routeQueries.entries()) {
                let [company, route] = query.split('|');
                logDataCollection(`🔍 正在掃描 [${company} ${route}] 全線中途站 ETA...`, "info");
                
                let apiUrl = company === 'KMB' ? `${KMB_API}/route-eta/${route}/1` : `${CTB_API}/route-eta/CTB/${route}`;
                try {
                    let res = await fetch(apiUrl).catch(()=>null);
                    if (!res) { logDataCollection(`❌ [${company} ${route}] API 連線失敗`, "error"); continue; }
                    let data = await res.json();
                    if (!data.data || data.data.length === 0) continue;
                    
                    let etasMap = { 'I': {}, 'O': {} };
                    data.data.forEach(item => {
                        if (item.eta) {
                            let bound = (item.dir === 'I' || item.dir === 'inbound') ? 'I' : 'O';
                            if (!etasMap[bound][item.stop]) etasMap[bound][item.stop] = [];
                            etasMap[bound][item.stop].push(item);
                        }
                    });
                    
                    for (let fav of favs) {
                        let bound = fav.dir === 'inbound' ? 'I' : 'O';
                        let stopEtas = etasMap[bound];
                        if (!stopEtas || !fav.routeStops || fav.routeStops.length < 2) continue;
                        
                        let newTrains = 0;
                        let routeStops = fav.routeStops;

                        // 逐站 (One by One) 掃描
                        for (let i = 0; i < routeStops.length - 1; i++) {
                            let oStop = routeStops[i]; let dStop = routeStops[i+1];
                            let oEtas = stopEtas[oStop.stopId]?.map(e => new Date(e.eta)).sort((a,b)=>a-b) || [];
                            let dEtas = stopEtas[dStop.stopId]?.map(e => new Date(e.eta)).sort((a,b)=>a-b) || [];
                            
                            if(oEtas.length === 0 || dEtas.length === 0) continue;

                            // 呼叫 TDAS 取得微段即時路況
                            let tdasRes = await getTdasSegmentTime(oStop.lat, oStop.long, dStop.lat, dStop.long);
                            let tdasMins = tdasRes.minutes || Math.max(1, (dStop.seq - oStop.seq) * 2);

                            // 檢查每一班抵達 oStop 的巴士
                            oEtas.forEach(oTime => {
                                let oDiff = Math.floor((oTime - now) / 60000);
                                // 捕捉視窗: 巴士剛到站或剛離開 (-1 至 1 分鐘)
                                if (oDiff >= -1 && oDiff <= 1) {
                                    let bestDTime = null; let smallestErr = Infinity;
                                    
                                    // 尋找符合 TDAS 物理預測的終點班次
                                    for (let dTime of dEtas) {
                                        let actualDelta = (dTime - oTime) / 60000;
                                        let err = Math.abs(actualDelta - tdasMins);
                                        // 交叉驗證容差：最少 3 分鐘，或 TDAS 時間的 30%
                                        let tolerance = Math.max(3, tdasMins * 0.3);
                                        
                                        if (actualDelta > 0 && err <= tolerance && err < smallestErr) {
                                            smallestErr = err; bestDTime = dTime;
                                        }
                                    }

                                    if (bestDTime) {
                                        let actualDelta = Math.floor((bestDTime - oTime) / 60000);
                                        let sig = `${company}_${route}_${oStop.stopId}_${dStop.stopId}_${bestDTime.getTime()}`;
                                        
                                        if(!trainedBuses.has(sig)) {
                                            logDataCollection(`✅ [${company} ${route}] 鎖定實體巴士: ${oStop.name.substring(0,4)}➔${dStop.name.substring(0,4)} | TDAS核對:${tdasMins}分 | ETA:${actualDelta}分`, "success");
                                            trainModel(company, route, fav.dir, oStop.stopId, dStop.stopId, oStop.name, dStop.name, actualDelta);
                                            trainedBuses.add(sig);
                                            newTrains++;
                                        }
                                    } else {
                                        // logDataCollection(`⚠️ [${company} ${route}] 拋棄異常數據: ${oStop.name.substring(0,4)}➔${dStop.name.substring(0,4)} | 無法吻合 TDAS 預測路況`, "warning");

        }

    async function fetchWithRetry(url, options = {}, retries = 3) {
        for (let i = 0; i < retries; i++) {
            try { const response = await fetch(url, options); if (!response.ok) return { error: `HTTP ${response.status}` }; return await response.json(); } 
            catch (err) { if (i === retries - 1) return { error: err.message || 'Network Failed' }; await new Promise(res => setTimeout(res, 500)); }
        }
    }

    async function getTdasSegmentTime(lat1, lon1, lat2, lon2) {
        if (!lat1 || !lon1 || !lat2 || !lon2) return { minutes: null, error: 'Invalid coordinates' };
        const key = `${parseFloat(lat1).toFixed(4)},${parseFloat(lon1).toFixed(4)}-${parseFloat(lat2).toFixed(4)},${parseFloat(lon2).toFixed(4)}`;
        const now = Date.now();
        if (tdasCache[key] && (now - tdasCache[key].timestamp < 3600000)) return { minutes: tdasCache[key].minutes, error: null };
        const payload = { start: { lat: lat1, long: lon1 }, end: { lat: lat2, long: lon2 }, departIn: 0, lang: "en", type: "ST" };
        const res = await fetchWithRetry(TDAS_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        if (!res || res.error || res.message) return { minutes: null, error: res ? res.error || res.message : 'Empty' };
        if (res.eta && res.eta.split(':').length === 2) {
            const timeParts = res.eta.split(':'); const mins = (parseInt(timeParts[0], 10) * 60) + parseInt(timeParts[1], 10);
            tdasCache[key] = { minutes: mins, timestamp: now }; localStorage.setItem('hkbus_tdas_cache', JSON.stringify(tdasCache)); return { minutes: mins, error: null };
        }
        return { minutes: null, error: 'Format error' };
    }

    function cleanExpiredCache() {
        const now = Date.now(); let changed = false;
        for (let key in tdasCache) { if (now - tdasCache[key].timestamp > 3600000) { delete tdasCache[key]; changed = true; } }
        if (changed) localStorage.setItem('hkbus_tdas_cache', JSON.stringify(tdasCache));
    }

    function getDistance(lat1, lon1, lat2, lon2) {
        if (!lat1 || !lon1 || !lat2 || !lon2) return 9999;
        const R = 6371e3; const rad = Math.PI / 180; const dLat = (lat2 - lat1) * rad; const dLon = (lon2 - lon1) * rad;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))); 
    }

    async function buildCtbCache(updateText) {
        let cached = JSON.parse(localStorage.getItem('hkbus_ctb_cache')); const now = Date.now();
        if (cached && (now - cached.timestamp < 86400000 * 7)) { window.ctbAllRouteStops = cached.routeStops; window.allCtbStopsCache = cached.stops; return true; }
        updateText.innerText = '✨ 首次城巴掃描：正在下載城巴路線庫 (需時約10-20秒)...'; updateText.style.color = '#e67e22';
        try {
            let rRes = await fetch(`${CTB_API}/route/CTB`); let rData = await rRes.json(); let routes = rData.data;
            let allRouteStops = []; let uniqueStopIds = new Set();
            const chunk = (arr, size) => Array.from({ length: Math.ceil(arr.length / size) }, (v, i) => arr.slice(i * size, i * size + size));
            let routeChunks = chunk(routes, 20);
            for (let i=0; i<routeChunks.length; i++) {
                updateText.innerText = `✨ 正在下載城巴路段數據... (${Math.round((i/routeChunks.length)*40)}%)`;
                let promises = routeChunks[i].flatMap(rt => [ fetch(`${CTB_API}/route-stop/CTB/${rt.route}/outbound`).then(r => r.json()).catch(()=>null), fetch(`${CTB_API}/route-stop/CTB/${rt.route}/inbound`).then(r => r.json()).catch(()=>null) ]);
                let results = await Promise.all(promises);
                results.forEach(res => { if (res && res.data) { res.data.forEach(s => { allRouteStops.push({ route: s.route, bound: s.dir === 'inbound' ? 'I' : 'O', seq: s.seq, stop: s.stop }); uniqueStopIds.add(s.stop); }); } });
            }
            let stopsDict = {}; let stopIdsArray = Array.from(uniqueStopIds); let stopChunks = chunk(stopIdsArray, 50); 
            for (let i=0; i<stopChunks.length; i++) {
                updateText.innerText = `✨ 正在下載城巴車站座標... (${40 + Math.round((i/stopChunks.length)*60)}%)`;
                let promises = stopChunks[i].map(id => fetch(`${CTB_API}/stop/${id}`).then(r => r.json()).catch(()=>null));
                let results = await Promise.all(promises);
                results.forEach(res => { if (res && res.data) { stopsDict[res.data.stop] = { name: res.data.name_tc, lat: parseFloat(res.data.lat), long: parseFloat(res.data.long) }; } });
            }
            window.ctbAllRouteStops = allRouteStops; window.allCtbStopsCache = stopsDict;
            try { localStorage.setItem('hkbus_ctb_cache', JSON.stringify({ timestamp: now, routeStops: allRouteStops, stops: stopsDict })); } catch (e) {} return true;
        } catch (err) { return false; }
    }

    async function searchRoute() {
        const company = document.getElementById('companySelect').value; const route = document.getElementById('routeInput').value.trim().toUpperCase(); const dir = document.getElementById('dirSelect').value;
        if (!route) return alert('請輸入路線號碼！');
        document.getElementById('loadingMsg').style.display = 'block'; document.getElementById('stopSelectionArea').style.display = 'none'; currentSearch = { company, route, dir, destName: '' };
        try {
            try { if (company === 'KMB') { const fRes = await fetch(`${KMB_API}/route/${route}/${dir}/1`); const fData = await fRes.json(); if(fData.data) currentSearch.destName = fData.data.dest_tc; } 
            else if (company === 'CTB') { const fRes = await fetch(`${CTB_API}/route/CTB/${route}`); const fData = await fRes.json(); if(fData.data) currentSearch.destName = dir === 'outbound' ? fData.data.dest_tc : fData.data.orig_tc; } } catch(e) {}
            let stopsData = []; let staticFares = null; try { const staticRes = await fetch(`./fares/${company}/${route}.json`); if (staticRes.ok) staticFares = await staticRes.json(); } catch (e) {}
            if (company === 'KMB') {
                const res = await fetch(`${KMB_API}/route-stop/${route}/${dir}/1`); const data = await res.json(); if (!data.data || data.data.length === 0) throw new Error('No data');
                stopsData = data.data.map(item => { const cache = allKmbStopsCache[item.stop] || { name: '未知車站', lat: 0, long: 0 }; return { id: item.stop, seq: item.seq, name: cache.name, lat: cache.lat, long: cache.long }; });
            } else if (company === 'CTB') {
                const res = await fetch(`${CTB_API}/route-stop/CTB/${route}/${dir}`); const data = await res.json(); if (!data.data || data.data.length === 0) throw new Error('No data');
                const stopPromises = data.data.map(async item => { try { const sRes = await fetch(`${CTB_API}/stop/${item.stop}`); const sData = await sRes.json(); return { id: item.stop, seq: item.seq, name: sData.data.name_tc, lat: parseFloat(sData.data.lat), long: parseFloat(sData.data.long) }; } catch (e) { return { id: item.stop, seq: item.seq, name: '未知車站', lat: 0, long: 0 }; } });
                stopsData = await Promise.all(stopPromises);
            }
            stopsData = stopsData.map(stop => { stop.fare = (staticFares && staticFares[dir] && staticFares[dir][stop.seq]) ? parseFloat(staticFares[dir][stop.seq]).toFixed(1) : '未知'; return stop; });
            currentStopsData = stopsData; renderOriginDropdown();
        } catch (error) { alert(`搵唔到呢條路線或暫時冇數據！`); }
        document.getElementById('loadingMsg').style.display = 'none';
    }

    async function autoDiscoverP2PRoutes(baseFav, radius = 100) {
        const oLat = baseFav.origin.lat; const oLong = baseFav.origin.long; const dLat = baseFav.destination.lat; const dLong = baseFav.destination.long; if (!oLat || !dLat) return; const updateText = document.getElementById('p2pUpdateTime');
        try {
            if (!window.kmbAllRouteStops) { updateText.innerText = '✨ 首次智能掃描：正在下載全港九巴路線資料庫...'; updateText.style.color = '#e67e22'; let res = await fetch(`${KMB_API}/route-stop`); let data = await res.json(); window.kmbAllRouteStops = data.data; }
            updateText.innerText = `✨ 正在比對 ${radius} 米內同路徑九巴...`; updateText.style.color = '#e67e22';
            let oStops = []; let dStops = []; for (let stopId in allKmbStopsCache) { let stop = allKmbStopsCache[stopId]; if (getDistance(oLat, oLong, stop.lat, stop.long) <= radius) oStops.push(stopId); if (getDistance(dLat, dLong, stop.lat, stop.long) <= radius) dStops.push(stopId); }
            let routesWithOrigin = window.kmbAllRouteStops.filter(item => oStops.includes(item.stop)); let routesWithDest = window.kmbAllRouteStops.filter(item => dStops.includes(item.stop));
            let addedRoutesMap = new Set(); let foundCount = 0;

            for (let oItem of routesWithOrigin) {
                let routeKey = `KMB_${oItem.route}_${oItem.bound}_${oItem.service_type}`; let dir = oItem.bound === 'I' ? 'inbound' : 'outbound';
                if (oItem.route === baseFav.route && dir === baseFav.dir && baseFav.company === 'KMB') continue; if (addedRoutesMap.has(routeKey)) continue; 
                let dItems = routesWithDest.filter(d => d.route === oItem.route && d.bound === oItem.bound && d.service_type === oItem.service_type && parseInt(oItem.seq) < parseInt(d.seq) );
                if (dItems.length > 0) {
                    let dItem = dItems[0]; let exists = p2pFavorites.find(f => f.route === oItem.route && f.dir === dir && f.company === 'KMB' && f.origin.stopId === oItem.stop && f.destination.stopId === dItem.stop);
                    if (!exists) {
                        let oCache = allKmbStopsCache[oItem.stop]; let dCache = allKmbStopsCache[dItem.stop];
                        let specificRouteStops = window.kmbAllRouteStops.filter(s => s.route === oItem.route && s.bound === oItem.bound && s.service_type === oItem.service_type && parseInt(s.seq) >= parseInt(oItem.seq) && parseInt(s.seq) <= parseInt(dItem.seq) ).sort((a, b) => parseInt(a.seq) - parseInt(b.seq));
                        let routeStops = specificRouteStops.map(s => { let cache = allKmbStopsCache[s.stop]; return { stopId: s.stop, name: cache ? cache.name : '', lat: cache ? cache.lat : 0, long: cache ? cache.long : 0, seq: s.seq }; }).filter(s => s.lat !== 0);
                        p2pFavorites.push({ id: Date.now().toString() + Math.random().toString(36).substr(2, 5), company: 'KMB', route: oItem.route, dir: dir, fare: '?', origin: { stopId: oItem.stop, stopName: oCache.name, lat: oCache.lat, long: oCache.long, seq: oItem.seq }, destination: { stopId: dItem.stop, stopName: dCache.name, lat: dCache.lat, long: dCache.long, seq: dItem.seq }, routeStops: routeStops });
                        addedRoutesMap.add(routeKey); foundCount++;
                    }
                }
            }

            let ctbSuccess = await buildCtbCache(updateText);
            if (ctbSuccess) {
                updateText.innerText = `✨ 正在比對 ${radius} 米內同路徑城巴...`; let oStopsCTB = []; let dStopsCTB = [];
                for (let stopId in window.allCtbStopsCache) { let stop = window.allCtbStopsCache[stopId]; if (getDistance(oLat, oLong, stop.lat, stop.long) <= radius) oStopsCTB.push(stopId); if (getDistance(dLat, dLong, stop.lat, stop.long) <= radius) dStopsCTB.push(stopId); }
                let routesWithOriginCTB = window.ctbAllRouteStops.filter(item => oStopsCTB.includes(item.stop)); let routesWithDestCTB = window.ctbAllRouteStops.filter(item => dStopsCTB.includes(item.stop));
                for (let oItem of routesWithOriginCTB) {
                    let routeKey = `CTB_${oItem.route}_${oItem.bound}`; let dir = oItem.bound === 'I' ? 'inbound' : 'outbound';
                    if (oItem.route === baseFav.route && dir === baseFav.dir && baseFav.company === 'CTB') continue; if (addedRoutesMap.has(routeKey)) continue; 
                    let dItems = routesWithDestCTB.filter(d => d.route === oItem.route && d.bound === oItem.bound && parseInt(oItem.seq) < parseInt(d.seq) );
                    if (dItems.length > 0) {
                        let dItem = dItems[0]; let exists = p2pFavorites.find(f => f.route === oItem.route && f.dir === dir && f.company === 'CTB' && f.origin.stopId === oItem.stop && f.destination.stopId === dItem.stop);
                        if (!exists) {
                            let oCache = window.allCtbStopsCache[oItem.stop]; let dCache = window.allCtbStopsCache[dItem.stop];
                            let specificRouteStops = window.ctbAllRouteStops.filter(s => s.route === oItem.route && s.bound === oItem.bound && parseInt(s.seq) >= parseInt(oItem.seq) && parseInt(s.seq) <= parseInt(dItem.seq) ).sort((a, b) => parseInt(a.seq) - parseInt(b.seq));
                            let routeStops = specificRouteStops.map(s => { let cache = window.allCtbStopsCache[s.stop]; return { stopId: s.stop, name: cache ? cache.name : '', lat: cache ? cache.lat : 0, long: cache ? cache.long : 0, seq: s.seq }; }).filter(s => s.lat !== 0);
                            p2pFavorites.push({ id: Date.now().toString() + Math.random().toString(36).substr(2, 5), company: 'CTB', route: oItem.route, dir: dir, fare: '?', origin: { stopId: oItem.stop, stopName: oCache.name, lat: oCache.lat, long: oCache.long, seq: oItem.seq }, destination: { stopId: dItem.stop, stopName: dCache.name, lat: dCache.lat, long: dCache.long, seq: dItem.seq }, routeStops: routeStops });
                            addedRoutesMap.add(routeKey); foundCount++;
                        }
                    }
                }
            }

            if (foundCount > 0) { localStorage.setItem('hkbus_favorites_v2', JSON.stringify(p2pFavorites)); renderP2PFavorites(); updateText.innerText = `✨ 掃描完成！自動加入 ${foundCount} 條路線。`; updateText.style.color = '#27ae60'; } 
            else { updateText.innerText = `✨ 掃描完成，無其他同路徑路線。`; updateText.style.color = '#7f8c8d'; } setTimeout(() => { renderAll(); }, 3000);
        } catch (err) { updateText.innerText = '❌ 智能掃描失敗。'; updateText.style.color = '#c0392b'; setTimeout(() => { renderAll(); }, 3000); }
    }

    function resetSearchArea() { document.getElementById('stopSelectionArea').style.display = 'none'; document.getElementById('routeInput').value = ''; }
    function deleteSingle(id) { if(confirm('移除呢條單站路線？')) { singleFavorites = singleFavorites.filter(f => f.id !== id); localStorage.setItem('hkbus_favorites', JSON.stringify(singleFavorites)); renderSingleFavorites(); } }
    function deleteP2P(id) { if(confirm('移除呢條點對點路線？')) { p2pFavorites = p2pFavorites.filter(f => f.id !== id); localStorage.setItem('hkbus_favorites_v2', JSON.stringify(p2pFavorites)); renderP2PFavorites(); } }
    
    function clearLearningCache() { 
        if(confirm('確定清除所有緩存及 AI 連續學習數據？')) { 
            travelTimeDB = {}; tdasCache = {}; aiModelDB = {}; trainedBuses = new Set();
            localStorage.removeItem('hkbus_travel_time_db'); localStorage.removeItem('hkbus_tdas_cache'); localStorage.removeItem('hkbus_ctb_cache'); localStorage.removeItem('hkbus_ai_model');
            alert('已清除所有 AI 及緩存數據！'); renderAll(); 
        } 
    }

    async function renderSingleFavorites() {
        const listDiv = document.getElementById('singleFavoritesList'); if (singleFavorites.length === 0) { listDiv.innerHTML = '<div class="empty-state">尚未加入單站路線。</div>'; return; }
        try {
            const promises = singleFavorites.map(async fav => {
                const reqDir = fav.dir === 'inbound' ? 'I' : 'O'; const url = fav.company === 'KMB' ? `${KMB_API}/eta/${fav.stopId}/${fav.route}/1` : `${CTB_API}/eta/CTB/${fav.stopId}/${fav.route}`;
                try { const res = await fetch(url); const data = await res.json(); return { fav, etas: (data.data || []).filter(i => i.eta != null && i.route === fav.route && (!i.dir || i.dir === reqDir)) }; } catch (e) { return { fav, etas: [] }; }
            });
            const results = await Promise.all(promises); const now = new Date(); const grouped = [];
            results.forEach(({ fav, etas }) => {
                let group = grouped.find(g => (fav.lat && g.lat) ? getDistance(fav.lat, fav.long, g.lat, g.long) <= 50 : g.names.includes(fav.stopName));
                if (!group) { group = { names: [fav.stopName], lat: fav.lat, long: fav.long, routes: [], allEtas: [] }; grouped.push(group); } else if (!group.names.includes(fav.stopName)) group.names.push(fav.stopName);
                group.routes.push(fav);
                etas.slice(0, 3).forEach(item => { const eTime = new Date(item.eta); if (Math.floor((eTime - now)/60000) >= -1) group.allEtas.push({ route: fav.route, company: fav.company, fare: fav.fare, dest: fav.dest, time: eTime, diff: Math.floor((eTime - now)/60000), rmk: item.rmk_tc || item.rmk_en || '' }); });
            });
            listDiv.innerHTML = grouped.map(group => {
                group.allEtas.sort((a, b) => a.time - b.time);
                const rTags = group.routes.map(f => `<span class="tracked-tag ${f.company==='KMB'?'badge-kmb':'badge-ctb'}">${f.route} <span class="delete-x" onclick="deleteSingle('${f.id}')">✕</span></span>`).join('');
                const eItems = group.allEtas.length === 0 ? '<li class="eta-item"><span style="color:#e74c3c">暫時沒有班次資料</span></li>' : 
                    group.allEtas.slice(0,10).map(e => {
                        const tText = e.diff <= 0 ? '即將' : `${e.diff}分`; const fHtml = (e.fare && e.fare !== '?' && e.fare !== '未知') ? `<span class="fare-tag">$${e.fare}</span>` : '';
                        const sDest = e.dest ? e.dest.substring(0, 2) : ''; const dHtml = sDest ? `<span class="dest-text">往${sDest}</span>` : '';
                        return `<li class="eta-item"><div class="eta-route-info"><span class="badge ${e.company==='KMB'?'badge-kmb':'badge-ctb'}">${e.route}</span> ${dHtml} ${fHtml}</div><div class="eta-time-info"><span class="origin-time">${tText}</span> <span class="rmk-text">${e.rmk?`(${e.rmk})`:''}</span></div></li>`;
                    }).join('');
                return `<div class="bus-card" data-ids="${group.routes.map(r=>r.id).join(',')}"><div class="stop-header header-single"><span class="drag-handle">≡</span><div class="stop-title">${group.names.join(' / ')}</div></div><div class="tracked-routes">${rTags}</div><ul class="eta-list">${eItems}</ul></div>`;
            }).join('');
        } catch (e) { listDiv.innerHTML = '<div class="empty-state" style="color:red">網絡錯誤</div>'; }
    }

    async function renderP2PFavorites() {
        const listDiv = document.getElementById('p2pFavoritesList'); if (p2pFavorites.length === 0) { listDiv.innerHTML = '<div class="empty-state">尚未加入點對點路線。</div>'; return; }
        
        try {
            const promises = p2pFavorites.map(async fav => {
                const reqDir = fav.dir === 'inbound' ? 'I' : 'O';
                const oUrl = fav.company === 'KMB' ? `${KMB_API}/eta/${fav.origin.stopId}/${fav.route}/1` : `${CTB_API}/eta/CTB/${fav.origin.stopId}/${fav.route}`;
                const dUrl = fav.company === 'KMB' ? `${KMB_API}/eta/${fav.destination.stopId}/${fav.route}/1` : `${CTB_API}/eta/CTB/${fav.destination.stopId}/${fav.route}`;
                
                try {
                    const [oRes, dRes] = await Promise.all([ fetch(oUrl).catch(()=>null), fetch(dUrl).catch(()=>null) ]); 
                    const oData = oRes ? await oRes.json() : { data: [] }; const dData = dRes ? await dRes.json() : { data: [] };
                    return { fav, oEtas: (oData.data || []).filter(i => i.eta != null && i.route === fav.route && (!i.dir || i.dir === reqDir)), dEtas: (dData.data || []).filter(i => i.eta != null && i.route === fav.route && (!i.dir || i.dir === reqDir)) };
                } catch (e) { return { fav, oEtas: [], dEtas: [] }; }
            });
            
            const results = await Promise.all(promises); const now = new Date(); const grouped = [];
            
            results.forEach(({ fav, oEtas, dEtas }) => {
                let group = grouped.find(g => {
                    let oM = (fav.origin.lat && g.oLat) ? getDistance(fav.origin.lat, fav.origin.long, g.oLat, g.oLong) <= 50 : g.oNames.includes(fav.origin.stopName);
                    let dM = (fav.destination.lat && g.dLat) ? getDistance(fav.destination.lat, fav.destination.long, g.dLat, g.dLong) <= 50 : g.dNames.includes(fav.destination.stopName);
                    return oM && dM;
                });
                
                if (!group) { group = { oNames: [fav.origin.stopName], dNames: [fav.destination.stopName], oLat: fav.origin.lat, oLong: fav.origin.long, dLat: fav.destination.lat, dLong: fav.destination.long, routes: [], allBuses: [] }; grouped.push(group); } 
                else { if (!group.oNames.includes(fav.origin.stopName)) group.oNames.push(fav.origin.stopName); if (!group.dNames.includes(fav.destination.stopName)) group.dNames.push(fav.destination.stopName); }
                
                group.routes.push(fav);
                let availD = dEtas.map(e => new Date(e.eta)).sort((a,b) => a-b);
                const routeKey = `${fav.company}_${fav.route}_${fav.dir}_${fav.origin.stopId}_${fav.destination.stopId}`;
                const stopDiff = Math.max(1, Math.abs(parseInt(fav.destination.seq || 0) - parseInt(fav.origin.seq || 0)));
                
                // 優先使用已訓練的 AI 矩陣加總，否則使用宏觀 AI
                let aiMatrixMins = predictTravelTimeMatrix(fav.company, fav.route, fav.dir, fav.routeStops);
                let aiMacroMins = predictTravelTime(routeKey);
                let methodType = ''; let estTravelMins = null;

                if (aiMatrixMins !== null) { estTravelMins = aiMatrixMins; methodType = 'ai_matrix'; }
                else if (aiMacroMins !== null) { estTravelMins = aiMacroMins; methodType = 'ai_model'; }
                else if (travelTimeDB[routeKey]) { estTravelMins = travelTimeDB[routeKey]; methodType = 'learned'; }
                else { estTravelMins = stopDiff * 1.5; methodType = 'none'; }
                
                const validOItems = oEtas.filter(item => Math.floor((new Date(item.eta) - now) / 60000) >= -1).slice(0, 3);
                
                validOItems.forEach((oItem, oIdx) => {
                    const oTime = new Date(oItem.eta); const oDiff = Math.floor((oTime - now) / 60000); let dTime = null; let finalMethod = methodType; 
                    
                    // 尋找最近似的終點時間 (純供畫面顯示用)
                    let smallestDiff = Infinity; let matchedIdx = -1;
                    let expectedDTime = new Date(oTime.getTime() + (estTravelMins * 60000));
                    
                    availD.forEach((d, idx) => {
                        let diffMins = Math.abs(d - expectedDTime) / 60000;
                        if (d > oTime && diffMins < smallestDiff) { smallestDiff = diffMins; matchedIdx = idx; }
                    });
                    
                    let tolerance = Math.max(12, estTravelMins * 0.35);
                    if (matchedIdx !== -1 && smallestDiff <= tolerance) {
                        dTime = availD[matchedIdx]; availD.splice(matchedIdx, 1); finalMethod = 'real';
                    } else {
                        dTime = expectedDTime;
                    }
                    
                    group.allBuses.push({ route: fav.route, company: fav.company, fare: fav.fare, oTime, oDiff, dTime, method: finalMethod || 'none', rmk: oItem.rmk_tc || oItem.rmk_en || '' });
                });
            });
            
            listDiv.innerHTML = grouped.map(group => {
                group.allBuses.sort((a, b) => { if (a.dTime && b.dTime) return a.dTime - b.dTime; if (a.dTime) return -1; if (b.dTime) return 1; return a.oTime - b.oTime; });
                const rTags = group.routes.map(f => `<span class="tracked-tag ${f.company==='KMB'?'badge-kmb':'badge-ctb'}">${f.route} <span class="delete-x" onclick="deleteP2P('${f.id}')">✕</span></span>`).join('');
                const eItems = group.allBuses.length === 0 ? '<li class="eta-item"><span style="color:#e74c3c">暫時沒有班次資料</span></li>' : 
                    group.allBuses.slice(0,10).map((b, i) => {
                        const oText = b.oDiff <= 0 ? '即將' : `${b.oDiff}分`; let dText = '無估算數據'; let dColor = '#95a5a6'; 
                        if (b.dTime) {
                            const timeStr = b.dTime.toLocaleTimeString('zh-HK', {hour: '2-digit', minute: '2-digit', hour12: false});
                            if (b.method === 'real') { dText = `${timeStr}`; dColor = '#e67e22'; } else if (b.method === 'ai_matrix') { dText = `${timeStr} (矩陣AI)`; dColor = '#ff4757'; } else if (b.method === 'ai_model') { dText = `${timeStr} (宏觀AI)`; dColor = '#8e44ad'; } else if (b.method === 'learned') { dText = `${timeStr} (史)`; dColor = '#27ae60'; } else { dText = `${timeStr} (估)`; dColor = '#95a5a6'; }
                        }
                        const fHtml = (b.fare && b.fare !== '?' && b.fare !== '未知') ? `<span class="fare-tag">$${b.fare}</span>` : ''; const fastTag = (i === 0 && b.dTime) ? '<span class="fastest-tag">⚡快</span>' : '';
                        return `<li class="eta-item"><div class="eta-route-info"><span class="badge ${b.company==='KMB'?'badge-kmb':'badge-ctb'}">${b.route}</span> ${fHtml}</div><div class="eta-time-info"><span class="origin-time">🟢${oText}</span><span class="arrow-icon">➔</span><span class="dest-time" style="color: ${dColor};">🏁${dText}</span>${fastTag}</div></li>`;
                    }).join('');
                return `<div class="bus-card" data-ids="${group.routes.map(r=>r.id).join(',')}"><div class="stop-header header-p2p"><span class="drag-handle">≡</span><div class="stop-title"><div class="stop-origin">起：${group.oNames.join(' / ')}</div><div class="stop-dest">終：${group.dNames.join(' / ')}</div></div></div><div class="tracked-routes">${rTags}</div><ul class="eta-list">${eItems}</ul></div>`;
            }).join('');
        } catch (e) { listDiv.innerHTML = '<div class="empty-state" style="color:red">網絡或計算錯誤</div>'; }
    }

    function exportData() {
        const backupPayload = { type: 'hkbus_combined', single: singleFavorites, p2p: p2pFavorites, learned: travelTimeDB, tdasCache: tdasCache, aiModel: aiModelDB };
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(backupPayload, null, 2)], { type: "application/json" }));
        a.download = `hkbus_ultimate_backup_${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
    
    function importData(event) {
        const file = event.target.files[0]; if (!file) return; const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data.type === 'hkbus_combined') { if (confirm('確定覆蓋所有資料？')) { 
                    singleFavorites = data.single || []; p2pFavorites = data.p2p || []; travelTimeDB = data.learned || {}; tdasCache = data.tdasCache || {}; aiModelDB = data.aiModel || {};
                    localStorage.setItem('hkbus_favorites', JSON.stringify(singleFavorites)); localStorage.setItem('hkbus_favorites_v2', JSON.stringify(p2pFavorites)); localStorage.setItem('hkbus_travel_time_db', JSON.stringify(travelTimeDB)); localStorage.setItem('hkbus_tdas_cache', JSON.stringify(tdasCache)); localStorage.setItem('hkbus_ai_model', JSON.stringify(aiModelDB));
                    renderAll(); alert('✅ 成功匯入資料！'); 
                } } else alert('❌ 檔案格式唔啱！');
            } catch (error) { alert('❌ 無法讀取檔案！'); } event.target.value = ''; 
        }; reader.readAsText(file);
    }
    
    window.onload = init;
</script>
