<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>終極巴士 Dashboard (TDAS 嚴格防錯配版)</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="巴士 ETA">
    <meta name="theme-color" content="#2c3e50">
    
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232c3e50%22/><text x=%2250%22 y=%2250%22 font-size=%2260%22 text-anchor=%22middle%22 dominant-baseline=%22central%22>🚌</text></svg>">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%22 y=%2250%22 font-size=%2260%22 text-anchor=%22middle%22 dominant-baseline=%22central%22>🚌</text></svg>">

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

    <style>
        :root {
            --bg: #f4f4f9; --card-bg: #ffffff; --text: #333333;
            --kmb-color: #e60012; --ctb-color: #fcd116; --ctb-text: #00558f; --fare-color: #d35400;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; justify-content: center; overscroll-behavior-y: none; }
        #app { width: 100%; max-width: 480px; background: var(--bg); min-height: 100vh; box-shadow: 0 0 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        header { background-color: #2c3e50; color: white; padding: calc(15px + env(safe-area-inset-top)) 20px 15px; text-align: center; font-size: 1.1rem; font-weight: bold; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        .header-title { flex: 1; text-align: left; }
        .header-refresh { background: #3498db; color: white; border: none; padding: 6px 12px; border-radius: 15px; font-size: 0.85rem; font-weight: bold; cursor: pointer; margin: 0; width: auto; }
        
        .container { padding: 15px; flex: 1; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        .section-boss { margin-bottom: 25px; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.03); }
        .section-title { font-size: 1.1rem; margin-bottom: 12px; font-weight: bold; border-bottom: 2px solid #eee; padding-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
        .section-icon { margin-right: 8px; }
        .update-info { text-align: right; font-size: 0.75rem; color: #7f8c8d; margin-bottom: 10px; min-height: 14px; }

        .input-group { display: flex; gap: 10px; margin-bottom: 10px; }
        input[type="text"], input[type="number"], select, button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; box-sizing: border-box; }
        button { background-color: #34495e; color: white; border: none; font-weight: bold; cursor: pointer; transition: opacity 0.2s; margin-bottom: 10px; }
        button:hover { opacity: 0.9; }
        .btn-add-single { background-color: #16a085; } .btn-add-p2p { background-color: #2980b9; }
        .btn-action-group { display: flex; gap: 10px; margin-top: 10px; } .btn-action-group button { margin-bottom: 0; flex: 1; font-size: 0.85rem; padding: 12px 5px;}
        
        .auto-discover-box { background: #e8f8f5; border: 1px dashed #1abc9c; padding: 8px 10px; border-radius: 6px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; color: #16a085; font-weight: bold; }
        .auto-discover-box input[type="checkbox"] { width: auto; margin: 0; transform: scale(1.2); }

        .bus-card { background: var(--card-bg); padding: 12px; border-radius: 8px; border: 1px solid #f0f0f0; margin-bottom: 12px; }
        .bus-card.sortable-ghost { opacity: 0.4; }
        
        .stop-header { display: flex; align-items: flex-start; margin-bottom: 10px; background: #f8f9fa; padding: 8px; border-radius: 6px; }
        .header-single { border-left: 4px solid #16a085; } .header-p2p { border-left: 4px solid #3498db; }
        .drag-handle { cursor: grab; font-size: 1.2rem; color: #95a5a6; margin-right: 10px; touch-action: none; }
        .stop-title { font-size: 0.95rem; font-weight: bold; line-height: 1.4; flex: 1; }
        .stop-origin { color: #2980b9; } .stop-dest { color: #c0392b; margin-top: 2px; }
        
        .tracked-routes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed #eee; }
        .tracked-tag { display: inline-flex; align-items: center; font-size: 0.8rem; padding: 3px 8px; border-radius: 12px; font-weight: bold; }
        .delete-x { margin-left: 6px; cursor: pointer; background: rgba(255,255,255,0.3); border-radius: 50%; width: 14px; height: 14px; display: inline-flex; justify-content: center; align-items: center; font-size: 0.7rem; }
        
        .badge { font-size: 0.8rem; padding: 2px 5px; border-radius: 4px; font-weight: bold; min-width: 28px; text-align: center; display: inline-block; flex-shrink: 0; }
        .badge-kmb { background-color: var(--kmb-color); color: white; } .badge-ctb { background-color: var(--ctb-color); color: var(--ctb-text); }
        .fare-tag { font-weight: bold; color: var(--fare-color); background: #fdf2e9; padding: 1px 3px; border-radius: 4px; font-size: 0.7rem; border: 1px solid #fad7a1; }

        .eta-list { list-style: none; padding: 0; margin: 0; }
        .eta-item { padding: 8px 0; border-bottom: 1px solid #f9f9f9; display: flex; justify-content: space-between; align-items: center; gap: 4px; }
        .eta-item:last-child { border-bottom: none; padding-bottom: 0; }
        .eta-route-info { display: flex; align-items: center; gap: 4px; flex-shrink: 0; max-width: 50%; }
        .eta-time-info { display: flex; align-items: center; justify-content: flex-end; flex-grow: 1; gap: 4px; }

        .origin-time { font-weight: bold; color: #27ae60; font-size: 0.9rem; }
        .dest-time { font-weight: bold; font-size: 0.85rem; }
        .arrow-icon { color: #bdc3c7; font-size: 0.7rem; }
        .fastest-tag { background: #ffcccc; color: #c0392b; font-size: 0.65rem; padding: 1px 3px; border-radius: 3px; font-weight: bold; flex-shrink: 0; }
        .rmk-text { color: #7f8c8d; font-size: 0.7rem; max-width: 40px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dest-text { font-size: 0.75rem; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50px; }
        
        #loadingMsg { display: none; color: #666; font-size: 0.9rem; text-align: center; margin-bottom: 10px; }
        .manual-fare-container { display: flex; align-items: center; gap: 10px; margin: 10px 0; background: #fef5f0; padding: 8px 12px; border-radius: 6px; border: 1px dashed var(--fare-color); }
        .manual-fare-label { font-size: 0.85rem; font-weight: bold; color: var(--fare-color); white-space: nowrap; }
        .empty-state { text-align: center; color: #aaa; font-size: 0.9rem; padding: 20px 0; }

        /* 🧠 AI Progress Bar CSS */
        .ai-route-item { background: #fafafa; border: 1px solid #eaeaea; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
        .ai-route-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; margin-bottom: 8px; }
        .ai-route-name { font-weight: bold; display: flex; align-items: center; gap: 6px; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; margin-right: 10px;}
        .ai-level-badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; background: #f4ebfa; color: #8e44ad; font-weight: bold; flex-shrink: 0;}
        .ai-progress-bg { background: #dfe6e9; border-radius: 10px; height: 8px; overflow: hidden; width: 100%; position: relative; margin-bottom: 5px; }
        .ai-progress-bar { background: linear-gradient(90deg, #9b59b6, #3498db); height: 100%; width: 0%; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .ai-progress-bar.master { background: linear-gradient(90deg, #f1c40f, #e67e22); }
        .ai-meta { display: flex; justify-content: space-between; font-size: 0.7rem; color: #7f8c8d; margin-bottom: 4px; }
        .ai-weights { font-size: 0.65rem; color: #2c3e50; background: #e8f8f5; padding: 4px; border-radius: 4px; font-family: monospace; display: flex; justify-content: space-between; }

        /* 💻 實時黑客終端機 */
        .ai-terminal { background: #1e1e1e; color: #a9dc76; font-family: 'Courier New', Courier, monospace; font-size: 0.75rem; padding: 10px; border-radius: 8px; height: 180px; overflow-y: auto; margin-top: 15px; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); border: 1px solid #333; }
        .ai-terminal::-webkit-scrollbar { width: 6px; }
        .ai-terminal::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        .ai-log-line { margin-bottom: 4px; border-bottom: 1px dotted #333; padding-bottom: 3px; line-height: 1.3; word-wrap: break-word;}
        .ai-log-time { color: #ab9df2; margin-right: 4px; }
        .ai-log-route { color: #fc9867; font-weight: bold; margin-right: 4px; }
        .ai-log-info { color: #78dce8; }
        .ai-log-success { color: #a9dc76; font-weight: bold; }
        .ai-log-warn { color: #ffd866; }
        .ai-log-err { color: #ff6188; }
        .ai-log-learn { color: #ffb86c; font-weight: bold; background: rgba(255,184,108,0.1); padding: 2px 0;}
    </style>
</head>
<body>

<div id="app">
    <header>
        <div class="header-title">🚌 終極巴士 Dashboard <span style="font-size:0.7rem; background:#8e44ad; padding:2px 6px; border-radius:10px;">TDAS 嚴格跟車版</span></div>
        <button class="header-refresh" onclick="renderAll()">🔄 更新</button>
    </header>
    
    <div class="container">
        
        <div class="section-boss" id="boss-single">
            <div class="section-title"><span><span class="section-icon">📍</span> 單站到站追蹤</span></div>
            <div id="singleUpdateTime" class="update-info"></div>
            <div id="singleFavoritesList"></div>
        </div>

        <div class="section-boss" id="boss-p2p">
            <div class="section-title"><span><span class="section-icon">🗺️</span> 點對點追蹤</span></div>
            <div id="p2pUpdateTime" class="update-info" style="color: rgb(39, 174, 96);"></div>
            <div id="p2pFavoritesList"></div>
        </div>

        <div class="section-boss">
            <div class="section-title"><span><span class="section-icon">🔍</span> 搜尋與新增路線</span></div>
            <div class="input-group">
                <select id="companySelect" style="flex: 1;"><option value="KMB">九巴 KMB</option><option value="CTB">城巴 CTB</option></select>
                <select id="dirSelect" style="flex: 1;"><option value="outbound">去程 (Outbound)</option><option value="inbound">回程 (Inbound)</option></select>
            </div>
            <input type="text" id="routeInput" placeholder="輸入路線 (如: 104, 112, 1A)" style="text-transform: uppercase;">
            <button onclick="searchRoute()" style="background-color: #2c3e50;">🔍 搜尋車站與車費</button>
            <div id="loadingMsg" style="display: none;">載入中...</div>
            
            <div id="stopSelectionArea" style="display: none; margin-top: 10px;">
                <select id="originSelect" onchange="updateDestDropdown()" style="margin-bottom: 10px;"><option value="">🟢 請選擇上車地點 (必填)...</option></select>
                <select id="destSelect" style="margin-bottom: 10px;"><option value="">🏁 請選擇下車地點 (如需點對點)...</option></select>
                
                <div class="manual-fare-container">
                    <span class="manual-fare-label">💰 車費($)：</span>
                    <input type="number" id="manualFareInput" step="0.1" placeholder="手動修正">
                </div>
                
                <div class="auto-discover-box">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="autoDiscoverCheck" checked="">
                        <label for="autoDiscoverCheck">✨ 自動尋找相同路徑巴士</label>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px; margin-left: 24px;">
                        <label for="searchRadius" style="font-size: 0.8rem; color: #16a085;">📍 搜尋範圍：</label>
                        <select id="searchRadius" style="width: auto; padding: 4px 8px; font-size: 0.85rem; border: 1px solid #1abc9c; border-radius: 4px; background: #fff; color: #16a085; font-weight: bold;">
                            <option value="50">50 米 (極精準)</option><option value="100" selected="">100 米 (建議)</option>
                            <option value="200">200 米</option><option value="300">300 米</option><option value="500">500 米</option>
                        </select>
                    </div>
                </div>
                
                <div class="btn-action-group">
                    <button class="btn-add-single" onclick="addSingleFavorite()">📍 加入單站</button>
                    <button class="btn-add-p2p" onclick="addP2PFavorite()">🗺️ 加入點對點</button>
                </div>
            </div>
        </div>

        <!-- 🧠 AI 學習進度板 & 實時終端機 -->
        <div class="section-boss" id="boss-ai-status">
            <div class="section-title"><span><span class="section-icon">🧠</span> AI 神經網絡狀態 (內置 TDAS 嚴格防錯配)</span></div>
            <div id="aiLearningList" class="empty-state">⏳ 等待收集足夠路線數據...</div>
            
            <div class="ai-terminal" id="aiTerminal">
                <div style="color:#78dce8; font-weight:bold; margin-bottom: 8px; border-bottom: 1px solid #555; padding-bottom:4px;">
                    &gt;_ AI 驗證日誌 (Live Console - TDAS 交叉鎖定)
                </div>
                <div id="aiTerminalLines">
                    <div class="ai-log-line"><span class="ai-log-time">[系統]</span> <span class="ai-log-success">AI 同一班車鎖定模組已載入。</span></div>
                </div>
            </div>
        </div>
        
        <div class="section-boss" style="background: transparent; box-shadow: none; padding: 0;">
            <div class="input-group" style="margin-bottom: 0;">
                <button onclick="exportData()" style="background-color: #e67e22;">📤 匯出備份</button>
                <button onclick="document.getElementById('importFile').click()" style="background-color: #8e44ad;">📥 匯入備份</button>
                <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
            </div>
            <div style="text-align: center; margin-top: 10px;">
                <button onclick="clearLearningCache()" style="background-color: #7f8c8d; font-size: 0.8rem; padding: 8px;">清除所有緩存及 AI 學習數據</button>
            </div>
        </div>
    </div>
</div>

<script>
    const KMB_API = 'https://data.etabus.gov.hk/v1/transport/kmb';
    const CTB_API = 'https://rt.data.gov.hk/v2/transport/citybus';
    const TDAS_API = 'https://tdas-api.hkemobility.gov.hk/tdas/api/route';
    
    let allKmbStopsCache = {};
    let allCtbStopsCache = {};
    let singleFavorites = JSON.parse(localStorage.getItem('hkbus_favorites')) || [];
    let p2pFavorites = JSON.parse(localStorage.getItem('hkbus_favorites_v2')) || [];
    let travelTimeDB = JSON.parse(localStorage.getItem('hkbus_travel_time_db')) || {};
    let tdasCache = JSON.parse(localStorage.getItem('hkbus_tdas_cache')) || {};
    
    let ctbCacheData = JSON.parse(localStorage.getItem('hkbus_ctb_cache'));
    if (ctbCacheData && ctbCacheData.stops) {
        allCtbStopsCache = ctbCacheData.stops;
    }

    let aiModelDB = JSON.parse(localStorage.getItem('hkbus_ai_model')) || {};
    const INITIAL_LEARNING_RATE = 0.1; 
    let trainedBuses = new Set();
    
    let isUpdating = false;
    let currentStopsData = [];
    let currentSearch = {};

    let tdasRequestQueue = Promise.resolve();
    const TDAS_INTERVAL = 80; 

    // ==========================================
    // 💻 AI 實時日誌系統 (Live Console)
    // ==========================================
    function logAI(msg, type = 'info', route = '') {
        const term = document.getElementById('aiTerminalLines');
        if(!term) return;
        const time = new Date().toLocaleTimeString('zh-HK', {hour12:false});
        
        let colorClass = 'ai-log-info';
        if (type === 'success') colorClass = 'ai-log-success';
        if (type === 'warn') colorClass = 'ai-log-warn';
        if (type === 'err') colorClass = 'ai-log-err';
        if (type === 'learn') colorClass = 'ai-log-learn';
        
        const line = document.createElement('div');
        line.className = 'ai-log-line';
        line.innerHTML = `<span class="ai-log-time">[${time}]</span> ${route ? `<span class="ai-log-route">[${route}]</span> ` : ''}<span class="${colorClass}">${msg}</span>`;
        
        term.appendChild(line);
        while(term.childNodes.length > 50) {
            term.removeChild(term.firstChild);
        }
        const termContainer = document.getElementById('aiTerminal');
        termContainer.scrollTop = termContainer.scrollHeight;
    }

    // ==========================================
    // 🧠 AI 神經網絡特徵與訓練
    // ==========================================
    function getFeatures() {
        const d = new Date(); const hour = d.getHours();
        return { 
            base: 1, 
            weekend: (d.getDay() === 0 || d.getDay() === 6) ? 1 : 0, 
            morningRush: (hour >= 7 && hour < 10) ? 1 : 0, 
            eveningRush: (hour >= 17 && hour < 20) ? 1 : 0 
        };
    }

    function trainModel(company, route, dir, oId, dId, oName, dName, actualMins) {
        const routeKey = `${company}_${route}_${dir}_${oId}_${dId}`;
        const features = getFeatures();
        
        if (!aiModelDB[routeKey]) { 
            aiModelDB[routeKey] = { wBase: actualMins, wWeekend: 0, wMorning: 0, wEvening: 0, company, route, oName, dName, trainCount: 0, lastError: 0, lastUpdate: 0 }; 
            logAI(`建立新學習模型，初始基準設為 ${actualMins} 分鐘。`, 'info', route);
        }
        
        let weights = aiModelDB[routeKey];
        let predictedMins = weights.wBase * features.base + weights.wWeekend * features.weekend + weights.wMorning * features.morningRush + weights.wEvening * features.eveningRush;
        let error = actualMins - predictedMins;
        
        if (Math.abs(error) > Math.max(15, predictedMins * 0.8)) {
            logAI(`⚠️ 數據異常！實際需時 ${actualMins}分，偏離預期(${Math.round(predictedMins)}分)過大，放棄此筆學習。`, 'warn', route);
            return;
        }

        let currentLR = Math.max(0.01, INITIAL_LEARNING_RATE / Math.sqrt(weights.trainCount + 1));

        weights.wBase = Math.max(1, weights.wBase + currentLR * error * features.base);
        weights.wWeekend += currentLR * error * features.weekend;
        weights.wMorning += currentLR * error * features.morningRush;
        weights.wEvening += currentLR * error * features.eveningRush;
        
        weights.trainCount += 1;
        weights.lastError = Math.abs(error);
        weights.lastUpdate = Date.now();
        weights.oName = oName; 
        weights.dName = dName;
        
        let shortO = oName.replace('總站','').replace('巴士','');
        let shortD = dName.replace('總站','').replace('巴士','');
        
        logAI(`🧠 學習成功！路段: ${shortO}➔${shortD}`, 'learn', route);
        logAI(`➔ 實際: ${actualMins}分 | AI預測: ${predictedMins.toFixed(1)}分 | 調整基準: ${weights.wBase.toFixed(1)}分`, 'success', route);
        
        aiModelDB[routeKey] = weights;
        localStorage.setItem('hkbus_ai_model', JSON.stringify(aiModelDB));
        renderAILearningProgress(); 
    }

    function predictTravelTime(routeKey) {
        if (!aiModelDB[routeKey]) return null;
        const features = getFeatures(); const weights = aiModelDB[routeKey];
        return Math.max(1, Math.round(weights.wBase * features.base + weights.wWeekend * features.weekend + weights.wMorning * features.morningRush + weights.wEvening * features.eveningRush));
    }

    // ==========================================
    // 🚦 TDAS 段落及子路徑時間累加（用於同一班車驗證）
    // ==========================================
    async function getTdasTimeForPair(fav, oStopId, dStopId) {
        // 如果沒有完整的路線站點資訊，直接做起點終點單段查詢
        if (!fav.routeStops || fav.routeStops.length <= 1) {
            const r = await getTdasSegmentTime(fav.origin.lat, fav.origin.long, fav.destination.lat, fav.destination.long);
            return r.minutes;
        }
        
        // 尋找起點與終點在 routeStops 中的順序索引
        const oIdx = fav.routeStops.findIndex(s => s.stopId === oStopId);
        const dIdx = fav.routeStops.findIndex(s => s.stopId === dStopId);
        
        if (oIdx === -1 || dIdx === -1 || oIdx >= dIdx) {
            // 備用方案：如果無法對應索引，則嘗試獲取主座標直接比對
            let oLat = fav.origin.stopId === oStopId ? fav.origin.lat : null;
            let oLng = fav.origin.stopId === oStopId ? fav.origin.long : null;
            let dLat = fav.destination.stopId === dStopId ? fav.destination.lat : null;
            let dLng = fav.destination.stopId === dStopId ? fav.destination.long : null;
            
            if (!oLat) { const s = fav.routeStops.find(x => x.stopId === oStopId); if (s) { oLat = s.lat; oLng = s.long; } }
            if (!dLat) { const s = fav.routeStops.find(x => x.stopId === dStopId); if (s) { dLat = s.lat; dLng = s.long; } }
            
            if (oLat && dLat) {
                const r = await getTdasSegmentTime(oLat, oLng, dLat, dLng);
                return r.minutes;
            }
            return null;
        }
        
        // 計算各相鄰中途站之間的 TDAS 時間並累加
        let totalMins = 0;
        for (let i = oIdx; i < dIdx; i++) {
            const r = await getTdasSegmentTime(fav.routeStops[i].lat, fav.routeStops[i].long, fav.routeStops[i+1].lat, fav.routeStops[i+1].long);
            if (r.minutes === null) return null;
            totalMins += r.minutes;
        }
        return totalMins;
    }

    // ==========================================
    // 🤖 自動掃描與學習引擎
    // ==========================================
    async function startAutoLearningEngine() {
        async function scanAndLearn() {
            if (p2pFavorites.length === 0) return;
            const now = new Date();
            let routeQueries = new Set();
            p2pFavorites.forEach(fav => routeQueries.add(`${fav.company}|${fav.route}`));
            
            logAI(`📡 全局 API 同一班車鎖定掃描啟動...`, 'info');

            for (let query of routeQueries) {
                let [company, route] = query.split('|');
                let matchingFavs = p2pFavorites.filter(f => f.company === company && f.route === route);
                let etasMap = { 'I': {}, 'O': {} };
                
                try {
                    if (company === 'KMB') {
                        let res = await fetch(`${KMB_API}/route-eta/${route}/1`).catch(()=>null);
                        if (!res) continue;
                        let data = await res.json();
                        if (!data.data || data.data.length === 0) continue;
                        
                        data.data.forEach(item => {
                            if (item.eta) {
                                let bound = (item.dir === 'I' || item.dir === 'inbound') ? 'I' : 'O';
                                if (!etasMap[bound][item.stop]) etasMap[bound][item.stop] = [];
                                etasMap[bound][item.stop].push(item);
                            }
                        });
                    } else if (company === 'CTB') {
                        for (let fav of matchingFavs) {
                            let bound = fav.dir === 'inbound' ? 'I' : 'O';
                            let [oRes, dRes] = await Promise.all([
                                fetch(`${CTB_API}/eta/CTB/${fav.origin.stopId}/${route}`).catch(()=>null),
                                fetch(`${CTB_API}/eta/CTB/${fav.destination.stopId}/${route}`).catch(()=>null)
                            ]);
                            if (oRes) {
                                let oData = await oRes.json();
                                (oData.data || []).forEach(item => {
                                    if (item.eta) {
                                        if (!etasMap[bound][item.stop]) etasMap[bound][item.stop] = [];
                                        etasMap[bound][item.stop].push(item);
                                    }
                                });
                            }
                            if (dRes) {
                                let dData = await dRes.json();
                                (dData.data || []).forEach(item => {
                                    if (item.eta) {
                                        if (!etasMap[bound][item.stop]) etasMap[bound][item.stop] = [];
                                        etasMap[bound][item.stop].push(item);
                                    }
                                });
                            }
                        }
                    }
                    
                    for (let fav of matchingFavs) {
                        let bound = fav.dir === 'inbound' ? 'I' : 'O';
                        let stopEtas = etasMap[bound];
                        if (!stopEtas) continue;
                        
                        let pairsMap = new Map();
                        pairsMap.set(`${fav.origin.stopId}_${fav.destination.stopId}`, { o: fav.origin, d: fav.destination });
                        
                        if (fav.routeStops && fav.routeStops.length > 1 && fav.routeStops[0].stopId) {
                            for (let i = 0; i < fav.routeStops.length - 1; i++) {
                                pairsMap.set(`${fav.routeStops[i].stopId}_${fav.routeStops[i+1].stopId}`, { o: fav.routeStops[i], d: fav.routeStops[i+1] });
                                if (i > 0) pairsMap.set(`${fav.routeStops[0].stopId}_${fav.routeStops[i].stopId}`, { o: fav.routeStops[0], d: fav.routeStops[i] });
                                if (i < fav.routeStops.length - 1) pairsMap.set(`${fav.routeStops[i].stopId}_${fav.routeStops[fav.routeStops.length-1].stopId}`, { o: fav.routeStops[i], d: fav.routeStops[fav.routeStops.length-1] });
                            }
                        }
                        
                        let pairsToTrain = Array.from(pairsMap.values());
                        
                        for (let pair of pairsToTrain) {
                            if (!stopEtas[pair.o.stopId] || !stopEtas[pair.d.stopId]) continue;
                            
                            let oDates = stopEtas[pair.o.stopId].map(e => new Date(e.eta)).sort((a,b)=>a-b);
                            let dDates = stopEtas[pair.d.stopId].map(e => new Date(e.eta)).sort((a,b)=>a-b);
                            if (oDates.length === 0 || dDates.length === 0) continue;
                            
                            let routeKey = `${company}_${route}_${fav.dir}_${pair.o.stopId}_${pair.d.stopId}`;
                            
                            // 🌟 改進：在背景比對時，直接使用該子路段相應的 TDAS 行車時間做配對
                            let tdasMins = await getTdasTimeForPair(fav, pair.o.stopId, pair.d.stopId);
                            let seqDiff = Math.max(1, Math.abs(parseInt(pair.d.seq || 0) - parseInt(pair.o.seq || 0)));
                            let estMins = tdasMins || predictTravelTime(routeKey) || travelTimeDB[routeKey] || (seqDiff * 1.5) || 15;
                            
                            let optimalMatches = optimizeP2PMatching(oDates, dDates, estMins);
                            
                            oDates.forEach((oTime, oIdx) => {
                                let oDiff = Math.floor((oTime - now) / 60000);
                                if (optimalMatches.has(oIdx)) {
                                    let dTime = dDates[optimalMatches.get(oIdx)];
                                    
                                    if (oDiff >= -2 && oDiff <= 5 && dTime) {
                                        // 🌟 修正公式：(dTime - oTime) 才是這班車真正的行車時間，而不是相對於現在時間 (dTime - now)
                                        let actualTravelMins = Math.floor((dTime - oTime) / 60000); 
                                        let busSig = `${routeKey}_${dTime.getTime()}`; 
                                        
                                        if (actualTravelMins > 1 && actualTravelMins < 180 && !trainedBuses.has(busSig)) {
                                            
                                            // 🌟 關鍵跟車校正：使用 TDAS API 進行交叉比對 (Cross Check)
                                            if (tdasMins !== null) {
                                                let deviation = Math.abs(actualTravelMins - tdasMins);
                                                let maxAllowed = Math.max(4, tdasMins * 0.2); // 允許 20% 的合理路況誤差或最少 4 分鐘
                                                
                                                if (deviation > maxAllowed) {
                                                    let shortO = (pair.o.name || pair.o.stopName || '未知').substring(0, 5);
                                                    let shortD = (pair.d.name || pair.d.stopName || '未知').substring(0, 5);
                                                    logAI(`❌ TDAS 驗證不通過！時序差 (${actualTravelMins}分) 偏離 TDAS 估算 (${tdasMins}分) 超過限制 (±${maxAllowed.toFixed(1)}分)。[${shortO}➔${shortD}] 判定為非同一班車（拖卡錯配），拒絕學習。`, 'err', route);
                                                    return; // 終止本次訓練，防止 AI 被垃圾數據污染大腦
                                                } else {
                                                    logAI(`✓ TDAS 驗證通過。預期 ${tdasMins}分，實際相差 ${actualTravelMins}分。確認為同一架巴士。`, 'success', route);
                                                }
                                            } else {
                                                logAI(`⚠️ 無法獲取 TDAS，略過同車交叉驗證。`, 'warn', route);
                                            }

                                            trainModel(company, route, fav.dir, pair.o.stopId, pair.d.stopId, pair.o.name || pair.o.stopName || '中途', pair.d.name || pair.d.stopName || '中途', actualTravelMins);
                                            trainedBuses.add(busSig);
                                            travelTimeDB[routeKey] = travelTimeDB[routeKey] ? Math.round(travelTimeDB[routeKey]*0.7 + actualTravelMins*0.3) : actualTravelMins;
                                            localStorage.setItem('hkbus_travel_time_db', JSON.stringify(travelTimeDB));
                                        }
                                    }
                                }
                            });
                        }
                    }
                } catch (e) { logAI(`⚠️ API 查詢失敗 (${route}): ${e.message}`, 'err', route); }
            }
        }
        setInterval(scanAndLearn, 60000); 
        setTimeout(scanAndLearn, 2000); 
    }

    function optimizeP2PMatching(oDates, dDates, estTravelMins) {
        if (!estTravelMins || oDates.length === 0 || dDates.length === 0) return new Map();
        const tolerance = Math.min(15, Math.max(5, estTravelMins * 0.3));
        let bestAssignment = new Map(); let minTotalCost = Infinity;

        function evaluateCombination(assignment) {
            let totalError = 0; let mappedCount = 0;
            for (let [oIdx, dIdx] of assignment.entries()) {
                const actualMins = (dDates[dIdx] - oDates[oIdx]) / 60000;
                const error = Math.abs(actualMins - estTravelMins);
                if (actualMins <= 0 || error > tolerance) return Infinity; 
                totalError += error; mappedCount++;
            }
            return totalError + ((oDates.length - mappedCount) * (tolerance * 2));
        }

        function backtrack(oIdx, currentAssignment) {
            if (oIdx === oDates.length) {
                const cost = evaluateCombination(currentAssignment);
                if (cost < minTotalCost) { minTotalCost = cost; bestAssignment = new Map(currentAssignment); }
                return;
            }
            backtrack(oIdx + 1, currentAssignment); 
            for (let dIdx = 0; dIdx < dDates.length; dIdx++) {
                if (Array.from(currentAssignment.values()).includes(dIdx)) continue;
                let isMonotonic = true;
                for (let [prevOIdx, prevDIdx] of currentAssignment.entries()) { if (prevDIdx >= dIdx) { isMonotonic = false; break; } }
                if (isMonotonic) { currentAssignment.set(oIdx, dIdx); backtrack(oIdx + 1, currentAssignment); currentAssignment.delete(oIdx); }
            }
        }
        backtrack(0, new Map()); return bestAssignment;
    }

    // ==========================================
    // 基本工具庫與 TDAS API 限流控制
    // ==========================================
    async function fetchWithRetry(url, options = {}, retries = 3) {
        for (let i = 0; i < retries; i++) {
            try { const response = await fetch(url, options); if (!response.ok) return { error: `HTTP ${response.status}` }; return await response.json(); } 
            catch (err) { if (i === retries - 1) return { error: err.message || 'Network Failed' }; await new Promise(res => setTimeout(res, 500)); }
        }
    }

    async function getTdasSegmentTime(lat1, lon1, lat2, lon2) {
        if (!lat1 || !lon1 || !lat2 || !lon2) return { minutes: null, error: 'Invalid coordinates' };
        const key = `${parseFloat(lat1).toFixed(4)},${parseFloat(lon1).toFixed(4)}-${parseFloat(lat2).toFixed(4)},${parseFloat(lon2).toFixed(4)}`;
        const now = Date.now();
        if (tdasCache[key] && (now - tdasCache[key].timestamp < 3600000)) return { minutes: tdasCache[key].minutes, error: null };

        return new Promise((resolve) => {
            tdasRequestQueue = tdasRequestQueue.then(async () => {
                const payload = { start: { lat: lat1, long: lon1 }, end: { lat: lat2, long: lon2 }, departIn: 0, lang: "en", type: "ST" };
                const res = await fetchWithRetry(TDAS_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                await new Promise(r => setTimeout(r, TDAS_INTERVAL));
                if (!res || res.error || res.message) { resolve({ minutes: null, error: res ? res.error || res.message : 'Empty' }); } 
                else if (res.eta && res.eta.split(':').length === 2) {
                    const timeParts = res.eta.split(':'); const mins = (parseInt(timeParts[0], 10) * 60) + parseInt(timeParts[1], 10);
                    tdasCache[key] = { minutes: mins, timestamp: now }; localStorage.setItem('hkbus_tdas_cache', JSON.stringify(tdasCache)); 
                    resolve({ minutes: mins, error: null });
                } else { resolve({ minutes: null, error: 'Format error' }); }
            });
        });
    }

    function cleanExpiredCache() {
        const now = Date.now(); let changed = false;
        for (let key in tdasCache) { if (now - tdasCache[key].timestamp > 3600000) { delete tdasCache[key]; changed = true; } }
        if (changed) localStorage.setItem('hkbus_tdas_cache', JSON.stringify(tdasCache));
    }

            let allRouteStops = []; let uniqueStopIds = new Set();
            const chunk = (arr, size) => Array.from({ length: Math.ceil(arr.length / size) }, (v, i) => arr.slice(i * size, i * size + size));
            let routeChunks = chunk(routes, 20);

        } catch (err) { return false; }
    }

    function getDistance(lat1, lon1, lat2, lon2) {
        if (!lat1 || !lon1 || !lat2 || !lon2) return 9999;
        const R = 6371e3; const rad = Math.PI / 180; const dLat = (lat2 - lat1) * rad; const dLon = (lon2 - lon1) * rad;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))); 
    }

                        addedRoutesMap.add(routeKey); foundCount++;
                    }

            }

            let ctbSuccess = await buildCtbCache(updateText);
            if (ctbSuccess) {
                updateText.innerText = `✨ 正在比對 ${radius} 米內同路徑城巴...`; let oStopsCTB = []; let dStopsCTB = [];
                for (let stopId in allCtbStopsCache) { let stop = allCtbStopsCache[stopId]; if (getDistance(oLat, oLong, stop.lat, stop.long) <= radius) oStopsCTB.push(stopId); if (getDistance(dLat, dLong, stop.lat, stop.long) <= radius) dStopsCTB.push(stopId); }

                    if (dItems.length > 0) {

                            let staticFares = fareCacheCTB[oItem.route]; if (staticFares && staticFares[dir] && staticFares[dir][oItem.seq]) { fare = parseFloat(staticFares[dir][oItem.seq]).toFixed(1); }
                            let specificRouteStops = window.ctbAllRouteStops.filter(s => s.route === oItem.route && s.bound === oItem.bound && parseInt(s.seq) >= parseInt(oItem.seq) && parseInt(s.seq) <= parseInt(dItem.seq) ).sort((a, b) => parseInt(a.seq) - parseInt(b.seq));
                            let routeStops = specificRouteStops.map(s => { let cache = allCtbStopsCache[s.stop]; return { stopId: s.stop, name: cache ? cache.name : '', lat: cache ? cache.lat : 0, long: cache ? cache.long : 0, seq: s.seq }; }).filter(s => s.lat !== 0);
                            p2pFavorites.push({ id: Date.now().toString() + Math.random().toString(36).substr(2, 5), company: 'CTB', route: oItem.route, dir: dir, fare: fare, origin: { stopId: oItem.stop, stopName: oCache.name, lat: oCache.lat, long: oCache.long, seq: oItem.seq }, destination: { stopId: dItem.stop, stopName: dCache.name, lat: dCache.lat, long: dCache.long, seq: dItem.seq }, routeStops: routeStops });
                            addedRoutesMap.add(routeKey); foundCount++;
                        }
                    }
                }
            }

            if (foundCount > 0) { localStorage.setItem('hkbus_favorites_v2', JSON.stringify(p2pFavorites)); renderP2PFavorites(); updateText.innerText = `✨ 掃描完成！成功為你自動加入 ${foundCount} 條同路徑路線。`; updateText.style.color = '#27ae60'; }

        } catch (err) { updateText.innerText = '❌ 智能掃描失敗，請稍後再試。'; updateText.style.color = '#c0392b'; setTimeout(() => { renderAll(); }, 3000); }
    }

    async function renderP2PFavorites() {
        const listDiv = document.getElementById('p2pFavoritesList'); if (p2pFavorites.length === 0) { listDiv.innerHTML = '<div class="empty-state">尚未加入點對點路線。</div>'; return; }
        
        try {
            const promises = p2pFavorites.map(async fav => {
                const reqDir = fav.dir === 'inbound' ? 'I' : 'O';
                const oUrl = fav.company === 'KMB' ? `${KMB_API}/eta/${fav.origin.stopId}/${fav.route}/1` : `${CTB_API}/eta/CTB/${fav.origin.stopId}/${fav.route}`;
                const dUrl = fav.company === 'KMB' ? `${KMB_API}/eta/${fav.destination.stopId}/${fav.route}/1` : `${CTB_API}/eta/CTB/${fav.destination.stopId}/${fav.route}`;
                
                const tdasPromise = (async () => {
                    let totalMins = 0; let success = true; let errMsg = null;
                    if (fav.routeStops && fav.routeStops.length > 1 && fav.routeStops[0].stopId) {
                        let segmentPromises = []; 
                        for (let i = 0; i < fav.routeStops.length - 1; i++) { 
                            segmentPromises.push(getTdasSegmentTime(
                                fav.routeStops[i].lat, fav.routeStops[i].long, 
                                fav.routeStops[i+1].lat, fav.routeStops[i+1].long
                            )); 
                        }
                        const segmentResults = await Promise.all(segmentPromises);
                        for (let r of segmentResults) { 
                            if (r.error) { success = false; errMsg = r.error; break; } 
                            if (r.minutes !== null) { totalMins += r.minutes; } else { success = false; break; } 
                        }
                    } else {
                        const r = await getTdasSegmentTime(fav.origin.lat, fav.origin.long, fav.destination.lat, fav.destination.long);
                        if (r.error) { success = false; errMsg = r.error; } else if (r.minutes !== null) { totalMins = r.minutes; } else { success = false; }
                    }
                    return { tdasMins: success ? totalMins : null, errorMsg: errMsg };
                })();

                try {
                    const [oRes, dRes, tdasResult] = await Promise.all([ fetch(oUrl).catch(()=>null), fetch(dUrl).catch(()=>null), tdasPromise ]); 
                    const oData = oRes ? await oRes.json() : { data: [] }; const dData = dRes ? await dRes.json() : { data: [] };
                    return { fav, oEtas: (oData.data || []).filter(i => i.eta != null && i.route === fav.route && (!i.dir || i.dir === reqDir)), dEtas: (dData.data || []).filter(i => i.eta != null && i.route === fav.route && (!i.dir || i.dir === reqDir)), tdasMins: tdasResult.tdasMins, errorMsg: tdasResult.errorMsg };
                } catch (e) { return { fav, oEtas: [], dEtas: [], tdasMins: null, errorMsg: e.message }; }
            });
            
            const results = await Promise.all(promises); const now = new Date(); const grouped = [];
            
            results.forEach(({ fav, oEtas, dEtas, tdasMins, errorMsg }) => {
                let group = grouped.find(g => {
                    let oM = (fav.origin.lat && g.oLat) ? getDistance(fav.origin.lat, fav.origin.long, g.oLat, g.oLong) <= 50 : g.oNames.includes(fav.origin.stopName);
                    let dM = (fav.destination.lat && g.dLat) ? getDistance(fav.destination.lat, fav.destination.long, g.dLat, g.dLong) <= 50 : g.dNames.includes(fav.destination.stopName);
                    return oM && dM;
                });
                
                if (!group) { group = { oNames: [fav.origin.stopName], dNames: [fav.destination.stopName], oLat: fav.origin.lat, oLong: fav.origin.long, dLat: fav.destination.lat, dLong: fav.destination.long, routes: [], allBuses: [] }; grouped.push(group); } 
                else { if (!group.oNames.includes(fav.origin.stopName)) group.oNames.push(fav.origin.stopName); if (!group.dNames.includes(fav.destination.stopName)) group.dNames.push(fav.destination.stopName); }
                
                group.routes.push(fav);
                let availD = dEtas.map(e => new Date(e.eta)).sort((a,b) => a-b);
                const routeKey = `${fav.company}_${fav.route}_${fav.dir}_${fav.origin.stopId}_${fav.destination.stopId}`;
                const stopDiff = Math.max(1, Math.abs(parseInt(fav.destination.seq || 0) - parseInt(fav.origin.seq || 0)));
                
                let estTravelMins = null; let methodType = ''; const aiPrediction = predictTravelTime(routeKey);

                if (tdasMins !== null) { estTravelMins = tdasMins + (stopDiff * 0.8); methodType = 'tdas'; } 
                else if (aiPrediction !== null) { estTravelMins = aiPrediction; methodType = 'ai_model'; } 
                else if (travelTimeDB[routeKey]) { estTravelMins = travelTimeDB[routeKey]; methodType = 'learned'; }
                
                const validOItems = oEtas.filter(item => Math.floor((new Date(item.eta) - now) / 60000) >= -1).slice(0, 3);
                const oDates = validOItems.map(item => new Date(item.eta));
                const optimalMatches = optimizeP2PMatching(oDates, availD, estTravelMins || (stopDiff * 1.5) || 15);

                validOItems.forEach((oItem, oIdx) => {
                    const oTime = oDates[oIdx]; const oDiff = Math.floor((oTime - now) / 60000); let dTime = null; let finalMethod = methodType; 

                    if (optimalMatches.has(oIdx)) {
                        const matchedDIdx = optimalMatches.get(oIdx); dTime = availD[matchedDIdx]; finalMethod = 'real';
                        
                        // 🌟 手動重新渲染刷新時，同樣使用修正後的 (dTime - oTime) 真實時差公式記錄數據
                        if (oDiff <= 2 && oDiff >= -1 && dTime) {
                            const actualTravelMins = Math.floor((dTime - oTime) / 60000);
                            const busSig = `${routeKey}_${dTime.getTime()}`;
                            
                            if (actualTravelMins > 1 && actualTravelMins < 180 && !trainedBuses.has(busSig)) { 
                                // 🌟 渲染手動學習觸發時亦做 TDAS 比對
                                if (tdasMins !== null) {
                                    let deviation = Math.abs(actualTravelMins - tdasMins);
                                    let maxAllowed = Math.max(4, tdasMins * 0.2);
                                    if (deviation <= maxAllowed) {
                                        trainModel(fav.company, fav.route, fav.dir, fav.origin.stopId, fav.destination.stopId, fav.origin.stopName, fav.destination.stopName, actualTravelMins);
                                        trainedBuses.add(busSig);
                                        travelTimeDB[routeKey] = travelTimeDB[routeKey] ? Math.round((travelTimeDB[routeKey] * 0.7) + (actualTravelMins * 0.3)) : actualTravelMins;
                                        localStorage.setItem('hkbus_travel_time_db', JSON.stringify(travelTimeDB));
                                    }
                                }
                            }
                        }
                    } else if (estTravelMins !== null) { dTime = new Date(oTime.getTime() + (estTravelMins * 60000)); }
                    
                    group.allBuses.push({ route: fav.route, company: fav.company, fare: fav.fare, oTime, oDiff, dTime, method: finalMethod || 'none', rmk: oItem.rmk_tc || oItem.rmk_en || '', errorMsg: errorMsg });
                });
            });
            
            listDiv.innerHTML = grouped.map(group => {
                group.allBuses.sort((a, b) => { if (a.dTime && b.dTime) return a.dTime - b.dTime; if (a.dTime) return -1; if (b.dTime) return 1; return a.oTime - b.oTime; });
                const rTags = group.routes.map(f => `<span class="tracked-tag ${f.company==='KMB'?'badge-kmb':'badge-ctb'}">${f.route} <span class="delete-x" onclick="deleteP2P('${f.id}')">✕</span></span>`).join('');
                const eItems = group.allBuses.length === 0 ? '<li class="eta-item"><span style="color:#e74c3c">暫時沒有班次資料</span></li>' : 
                    group.allBuses.slice(0,10).map((b, i) => {
                        const oText = b.oDiff <= 0 ? '即將' : `${b.oDiff}分`; let dText = '無估算數據'; let dColor = '#95a5a6'; 
                        if (b.dTime) {
                            const timeStr = b.dTime.toLocaleTimeString('zh-HK', {hour: '2-digit', minute: '2-digit', hour12: false});
                            if (b.method === 'real') { dText = `${timeStr}`; dColor = '#e67e22'; } else if (b.method === 'tdas') { dText = `${timeStr} 🚦`; dColor = '#2980b9'; } else if (b.method === 'ai_model') { dText = `${timeStr} (AI預測)`; dColor = '#8e44ad'; } else if (b.method === 'learned') { dText = `${timeStr} (史)`; dColor = '#27ae60'; }
                        } else if (b.errorMsg) { dText = `⚠️ 錯誤: ${b.errorMsg}`; dColor = '#c0392b'; }
                        const fHtml = (b.fare && b.fare !== '?' && b.fare !== '未知') ? `<span class="fare-tag">$${b.fare}</span>` : ''; const fastTag = (i === 0 && b.dTime) ? '<span class="fastest-tag">⚡快</span>' : '';
                        return `<li class="eta-item"><div class="eta-route-info"><span class="badge ${b.company==='KMB'?'badge-kmb':'badge-ctb'}">${b.route}</span> ${fHtml}</div><div class="eta-time-info"><span class="origin-time">🟢${oText}</span><span class="arrow-icon">➔</span><span class="dest-time" style="color: ${dColor};">🏁${dText}</span>${fastTag}</div></li>`;
                    }).join('');
                return `<div class="bus-card" data-ids="${group.routes.map(r=>r.id).join(',')}"><div class="stop-header header-p2p"><span class="drag-handle">≡</span><div class="stop-title"><div class="stop-origin">起：${group.oNames.join(' / ')}</div><div class="stop-dest">終：${group.dNames.join(' / ')}</div></div></div><div class="tracked-routes">${rTags}</div><ul class="eta-list">${eItems}</ul></div>`;
            }).join('');
        } catch (e) { listDiv.innerHTML = '<div class="empty-state" style="color:red">網絡或計算錯誤</div>'; }
    }

    function exportData() {
        const backupPayload = { type: 'hkbus_combined', single: singleFavorites, p2p: p2pFavorites, learned: travelTimeDB, tdasCache: tdasCache, aiModel: aiModelDB };
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(backupPayload, null, 2)], { type: "application/json" }));
        a.download = `hkbus_ultimate_backup_${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
    
    function importData(event) {
        const file = event.target.files[0]; if (!file) return; const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data.type === 'hkbus_combined') { if (confirm('確定覆蓋所有資料？')) { 
                    singleFavorites = data.single || []; p2pFavorites = data.p2p || []; travelTimeDB = data.learned || {}; tdasCache = data.tdasCache || {}; aiModelDB = data.aiModel || {};
                    localStorage.setItem('hkbus_favorites', JSON.stringify(singleFavorites)); localStorage.setItem('hkbus_favorites_v2', JSON.stringify(p2pFavorites)); localStorage.setItem('hkbus_travel_time_db', JSON.stringify(travelTimeDB)); localStorage.setItem('hkbus_tdas_cache', JSON.stringify(tdasCache)); localStorage.setItem('hkbus_ai_model', JSON.stringify(aiModelDB));
                    renderAll(); alert('✅ 成功匯入資料！'); 
                } } else alert('❌ 檔案格式唔啱！');
            } catch (error) { alert('❌ 無法讀取檔案！'); } event.target.value = ''; 
        }; reader.readAsText(file);
    }
    
    window.onload = init;
</script>
